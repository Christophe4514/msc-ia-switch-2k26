# Fast train — cible BLEU >= 25 (eval BLEU en fin, pas à chaque epoch)
model_name: facebook/nllb-200-distilled-600M
pair: fr-sw
src_lang: fra_Latn
tgt_lang: swh_Latn
tgt_file_ext: sw
dataset_root: dataset
max_source_length: 128
max_target_length: 128
max_train_samples: null
max_eval_samples: 256

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: [q_proj, v_proj, k_proj, out_proj]

num_train_epochs: 12
early_stopping_patience: 3
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.06
fp16: true
bf16: false
logging_steps: 50
eval_strategy: epoch
save_strategy: epoch
metric_for_best_model: eval_loss
greater_is_better: false
save_total_limit: 2
# Pas de generate pendant le train (très lent) — BLEU calculé à la fin
predict_with_generate: false
generation_max_length: 128
seed: 42
resume_from_checkpoint: true
output_dir: outputs/nllb-lora-fr-sw
report_to: none
