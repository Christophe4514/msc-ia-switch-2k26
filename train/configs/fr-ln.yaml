# Phase 2 — LoRA fine-tuning of NLLB-200 (default)
model_name: facebook/nllb-200-distilled-600M

# Language pair key used under dataset/<pair>/splits
pair: fr-ln
src_lang: fra_Latn
tgt_lang: lin_Latn
tgt_file_ext: ln

# Data
dataset_root: dataset
max_source_length: 128
max_target_length: 128
max_train_samples: null   # set e.g. 5000 for a smoke run
max_eval_samples: 1000

# LoRA (PEFT)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj
  - k_proj
  - out_proj

# Optimisation
num_train_epochs: 3
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
weight_decay: 0.01
warmup_ratio: 0.03
fp16: true
bf16: false
logging_steps: 50
eval_steps: 500
save_steps: 500
save_total_limit: 2
predict_with_generate: true
generation_max_length: 128
seed: 42

# Outputs
output_dir: outputs/nllb-lora-fr-ln
report_to: none
